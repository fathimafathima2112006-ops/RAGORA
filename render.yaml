services:
  - type: web
    name: ragora
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DB_PATH
        value: /var/data/ragora.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: ragora-data
      mountPath: /var/data
      sizeGB: 1
