services:
  - type: web
    name: ragora
    runtime: python
    plan: starter
    rootDir: ragora
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PRODUCTION
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: DB_PATH
        value: /var/data/ragora.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: ragora-data
      mountPath: /var/data
      sizeGB: 1
