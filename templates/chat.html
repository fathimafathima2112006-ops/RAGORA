<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="RAGORA AI Knowledge Platform">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<title>RAGORA · AI Knowledge Platform</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260923finalfix') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/ux_patch.css', v='20260923finalfix') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pro_upgrade.css', v='pro1') }}">
</head>

<body class="theme-light app-page">

<div class="app-bg" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="bg-grid"></div>
</div>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="brand" id="brandHome" type="button">
        <span class="brand-mark">R</span>
        <span>RAGORA</span>
      </button>
      <button class="icon-btn mobile-only" id="closeSidebar" type="button" aria-label="Close menu">×</button>
    </div>

    <button id="newChatBtn" class="new-chat" type="button">
      <span>＋</span>
      <b>New chat</b>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="chat" type="button">
        <span>⌁</span><b>AI Chat</b>
      </button>

      <div class="nav-label">WORKSPACE</div>

      <button class="nav-item" data-view="dashboard" type="button">
        <span>◫</span><b>Dashboard</b>
      </button>
      <button class="nav-item" data-view="knowledge" type="button">
        <span>▣</span><b>Knowledge Bases</b>
      </button>
      <button class="nav-item" data-view="documents" type="button">
        <span>▤</span><b>Documents</b>
      </button>
      <button class="nav-item" data-view="chunks" type="button">
        <span>◈</span><b>Chunk Explorer</b>
      </button>
      <button class="nav-item" data-view="retrieval" type="button">
        <span>⌘</span><b>Retrieval Explorer</b>
      </button>

      <div class="nav-label">INSIGHTS</div>

      <button class="nav-item" data-view="analytics" type="button">
        <span>◒</span><b>Analytics & Evaluation</b>
      </button>
      <button class="nav-item" data-view="history" type="button">
        <span>◷</span><b>Chat History</b>
      </button>

      <div class="nav-label">SYSTEM</div>

      <button class="nav-item" data-view="settings" type="button">
        <span>⚙</span><b>Settings</b>
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <!-- Google account + logout -->
    <div class="profile-account">
      <div class="profile-account-head">
        <span class="profile-google-dot">G</span>
        <span>Google account</span>
      </div>

      <div class="profile-card">
        <div class="profile-avatar-wrap">
          {% if picture %}
          <img
            class="profile-avatar-img"
            src="{{ picture }}"
            referrerpolicy="no-referrer"
            alt=""
            onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"
          >
          {% endif %}
          <span
            class="profile-avatar-fallback"
            {% if picture %}style="display:none"{% endif %}
          >{{ (name or 'R')[:1]|upper }}</span>
        </div>

        <div class="profile-copy">
          <strong>{{ name or 'RAGORA user' }}</strong>
          <span>Signed in with Google</span>
        </div>
      </div>

      <a href="{{ url_for('logout') }}" class="logout-btn">
        <span>↪</span>
        <b>Log out</b>
      </a>
    </div>
  </aside>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <main class="workspace">

    <header class="topbar">
      <div class="top-left">
        <button id="openSidebar" class="icon-btn mobile-only" type="button" aria-label="Open menu">☰</button>

        <button class="top-brand" id="topBrand" type="button">
          <span class="brand-mark">R</span>
          <b>RAGORA</b>
        </button>

        <span class="top-divider"></span>
        <span id="pageCrumb">AI Chat</span>
      </div>

      <div class="top-actions">
        <span class="status-pill"><i></i> RAG pipeline ready</span>
        <button id="themeToggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>
    </header>

    <div id="appView" class="view-host"></div>

  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<input
  id="fileInput"
  type="file"
  hidden
  multiple
  accept=".pdf,.docx,.pptx,.txt,.md,.csv,.xlsx,.json,.py,.js,.ts,.java,.c,.cpp,.html,.css,.sql"
>

<script>
  window.RAGORA_USER = {
    name: {{ name|tojson }},
    picture: {{ picture|tojson }}
  };
</script>

<!-- Main application JS first -->
<script src="{{ url_for('static', filename='js/chat.js', v='20260923finalfix') }}"></script>

<!-- Professional voice / feedback / language UI upgrade -->
<script src="{{ url_for('static', filename='js/pro_upgrade.js', v='pro1') }}"></script>

</body>
</html>
