<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14"><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<title>RAGORA · AI Knowledge Platform</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-dark app-page">
<div class="app-bg" aria-hidden="true"><div class="aurora a1"></div><div class="aurora a2"></div><div class="bg-grid"></div></div>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head"><button class="brand" id="brandHome"><span class="brand-mark">R</span><span>RAGORA</span></button><button class="icon-btn mobile-only" id="closeSidebar">×</button></div>
  <button id="newChatBtn" class="new-chat"><span>＋</span><b>New chat</b><kbd>Ctrl K</kbd></button>
  <nav class="nav" aria-label="Main navigation">
    <button class="nav-item active" data-view="chat"><span>⌁</span><b>AI Chat</b></button>
    <div class="nav-label">WORKSPACE</div>
    <button class="nav-item" data-view="dashboard"><span>◫</span><b>Dashboard</b></button>
    <button class="nav-item" data-view="knowledge"><span>▣</span><b>Knowledge Bases</b></button>
    <button class="nav-item" data-view="documents"><span>▤</span><b>Documents</b></button>
    <button class="nav-item" data-view="chunks"><span>◈</span><b>Chunk Explorer</b></button>
    <button class="nav-item" data-view="retrieval"><span>⌘</span><b>Retrieval Explorer</b></button>
    <div class="nav-label">INSIGHTS</div>
    <button class="nav-item" data-view="analytics"><span>◒</span><b>Analytics & Evaluation</b></button>
    <button class="nav-item" data-view="history"><span>◷</span><b>Chat History</b></button>
    <div class="nav-label">SYSTEM</div>
    <button class="nav-item" data-view="settings"><span>⚙</span><b>Settings</b></button>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="profile"><img src="{{ picture }}" referrerpolicy="no-referrer" alt=""><div><strong>{{ name }}</strong><span>Signed in</span></div><a href="{{ url_for('logout') }}" class="icon-btn" title="Sign out">↪</a></div>
</aside>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<main class="workspace">
<header class="topbar"><div class="top-left"><button id="openSidebar" class="icon-btn mobile-only">☰</button><button class="top-brand" id="topBrand"><span class="brand-mark">R</span><b>RAGORA</b></button><span class="top-divider"></span><span id="pageCrumb">AI Chat</span></div><div class="top-actions"><span class="status-pill"><i></i> RAG pipeline ready</span><button id="themeToggle" class="icon-btn" title="Toggle theme">◐</button></div></header>
<div id="appView" class="view-host"></div>
</main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="fileInput" type="file" hidden accept=".pdf,.docx,.txt,.md,.csv,.xlsx,.json,.py,.js,.ts,.java,.c,.cpp,.html,.css,.sql">
<script>window.RAGORA_USER={name:{{ name|tojson }},picture:{{ picture|tojson }}};</script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body></html>
